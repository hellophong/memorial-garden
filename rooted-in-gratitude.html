<title>Rooted in Gratitude</title>
<style>
/* Stacked-band UI: every part of the ceremony is a card in one overlapping
   stack. Bands cycle five colours so each overlap seam reads; the open band
   sits above its neighbours and shows in full. Home is open by default.
   Type is a single grotesque -- Helvetica, Arial as fallback -- and colour
   does the work that a second typeface would. Four bands take black type;
   the olive band is the one dark ground, so it takes light type. Olive is
   deepened 8% off the reference so the yellow accent clears 4.5:1 on it. */
:root,
:root[data-theme="light"],
:root[data-theme="dark"]{
  --yellow:#F7C948; --taupe:#CFC7BA; --pink:#F4A8D2; --peri:#93A9DE;
  --olive:#4E5C2B;
  --ink:#111111; --paper:#FFFFFF; --ground-2:#E8E4DD;
  --mute:#67625B;              /* 4.77:1 on the darkest ground it sits on */
  --rule:#DDD7CE;
  --on-dark:rgba(255,255,255,.28);
  --on-light:rgba(17,17,17,.20);
  --sans:Helvetica,Arial,"Liberation Sans",sans-serif;
  --lap:72px;   /* how far each band rides up over the one before it */
  --headpad:clamp(26px,3vw,44px);
}
*{box-sizing:border-box}
html{background:var(--ground-2)}
body{margin:0;background:var(--ground-2);color:var(--ink);font-family:var(--sans);
  font-size:16.5px;line-height:1.6;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{margin:0;font-weight:700;line-height:1.02;letter-spacing:-.032em;text-wrap:balance}
p{margin:0}
.wrap{max-width:1180px;margin:0 auto;padding:clamp(18px,3vw,44px) clamp(14px,3vw,34px) 0}

/* ---------------- the stack ---------------- */
.stack{position:relative;padding-bottom:clamp(30px,5vw,64px)}
/* The top radius is what makes the lap read as one card riding over another;
   without it a full-width rectangle over a full-width rectangle has the same
   silhouette as a flush stack, and only the shadow hints at the overlap. */
.item{position:relative;margin-top:calc(var(--lap) * -1);overflow:hidden;
  border-radius:clamp(16px,1.8vw,26px) clamp(16px,1.8vw,26px) 0 0;
  box-shadow:0 -16px 34px rgba(17,17,17,.20)}
.item:first-child{margin-top:0;box-shadow:none}
.item.open{z-index:6}
.item.open + .item{margin-top:0}

/* band head — always visible */
.head{width:100%;appearance:none;border:0;cursor:pointer;font-family:inherit;text-align:left;
  display:grid;grid-template-columns:auto minmax(0,1.9fr) minmax(0,1fr) auto;
  align-items:center;gap:clamp(14px,2.6vw,38px);
  padding:var(--headpad) clamp(18px,3vw,40px) calc(var(--headpad) + var(--lap));
  background:var(--bg);color:var(--fg)}
.head:focus-visible{outline:3px solid var(--focus);outline-offset:-4px}
/* the home band carries a full date rather than a clock time, so it needs a
   wider title column and a smaller eyebrow to keep the line intact */
.head.home{grid-template-columns:auto minmax(0,2.4fr) minmax(0,.72fr) auto}
.head.home .time{font-size:clamp(13px,1.6vw,20px);letter-spacing:.16em;
  text-transform:uppercase;white-space:nowrap}
.num{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;flex:none;
  border:1.5px solid currentColor;font-size:14px;font-weight:700;opacity:.9}
.tn{min-width:0}
.time{font-size:clamp(17px,2vw,26px);font-weight:700;letter-spacing:.1em;color:var(--accentc);
  display:block}
.name{font-size:clamp(44px,7.7vw,108px);font-weight:700;letter-spacing:-.042em;line-height:.98;
  margin-top:4px}
.desc{font-size:16.5px;line-height:1.45;opacity:.86;min-width:0}
.mark{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;flex:none;
  border:1.5px solid currentColor;font-size:19px;transition:transform .22s ease}
.item.open .mark{transform:rotate(90deg)}
.head:hover .mark{background:var(--accentc);color:var(--bg);border-color:var(--accentc)}

/* band body — only when open */
.body{display:none;background:var(--bodybg);color:var(--bodyfg);
  padding:0 clamp(18px,3vw,40px) clamp(30px,3.6vw,52px)}
.item.open .body{display:block}
.item.open .head{padding-bottom:var(--headpad)}
.bodyin{border-top:1px solid var(--bodyrule);padding-top:clamp(24px,3vw,40px)}

/* ---------------- home band ---------------- */
.homegrid{max-width:none}
.homegrid p{font-size:clamp(19px,2vw,25px);line-height:1.52}
.homegrid em{font-style:italic;color:inherit;font-weight:700}
.epi{border-left:3px solid currentColor;padding-left:26px;margin-top:clamp(30px,3.6vw,48px)}
.epi q{quotes:none;font-style:italic;font-size:clamp(21px,2.4vw,30px);line-height:1.4;display:block}
.epi cite{display:block;margin-top:13px;font-size:11px;letter-spacing:.2em;text-transform:uppercase;
  color:inherit;opacity:.72;font-style:normal;font-weight:700}

/* ---------------- movement body content ---------------- */
.two{max-width:none}
.dir{font-size:clamp(18px,1.9vw,23px);line-height:1.52;margin-bottom:clamp(24px,3vw,40px)}
.dir strong{font-weight:700;color:var(--accentc)}
.card{background:var(--paper);color:var(--ink);padding:28px 30px}
.card+.card,.card+.opts,.opts+.card{margin-top:18px}
.lbl{font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:var(--mute);
  margin-bottom:16px;font-weight:700}
.card p{margin:0 0 16px;line-height:1.62;font-size:18px}
.card p:last-child{margin-bottom:0}
.pt{font-size:clamp(27px,3vw,38px);margin-bottom:4px;font-weight:700;color:var(--olive)}
.pby{font-size:11.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--mute);
  margin-bottom:20px;font-weight:700}
.verse{font-style:italic;font-size:19px;line-height:1.7;white-space:pre-wrap}
.pn{margin-top:20px;padding-top:16px;border-top:1px solid var(--rule);font-size:15px;
  line-height:1.58;color:var(--mute)}
.opts{list-style:none;margin:18px 0 0;padding:0;display:grid;gap:2px}
.opts li{background:var(--paper);color:var(--ink);padding:18px 22px;display:grid;
  grid-template-columns:1fr auto;gap:6px 18px;align-items:start}
.opts .on{font-size:clamp(19px,1.9vw,24px);font-weight:700}
.opts .os{display:block;font-size:12px;color:var(--mute);margin-top:5px;font-weight:400}
.opts .od{grid-column:1/-1;font-size:15px;line-height:1.56;color:var(--mute);margin-top:6px}
.tag{font-size:10px;letter-spacing:.16em;text-transform:uppercase;padding:6px 12px;
  border-radius:100px;white-space:nowrap;font-weight:700;border:1px solid var(--rule);
  color:var(--mute)}
.tag.ok{color:var(--olive);border-color:var(--olive)}
.tag.warn{color:var(--mute);border-color:var(--mute);background:var(--ground-2)}
.tag.pick{color:var(--paper);background:var(--olive);border-color:var(--olive)}

.foot{padding:44px clamp(18px,3vw,40px) 56px;font-size:13.5px;line-height:1.8;
  color:var(--mute)}

@media (max-width:820px){
  :root{--lap:44px;--headpad:20px}
  /* the bottom pad must keep carrying the lap here too, or the band below
     rides up over the name instead of over the padding beneath it */
  .head{grid-template-columns:auto minmax(0,1fr) auto;gap:16px;
    padding:var(--headpad) clamp(16px,4vw,24px) calc(var(--headpad) + var(--lap))}
  .desc{display:none}
  .homegrid{grid-template-columns:1fr}
  /* the full date is one unbreakable line on desktop; at this width it is
     wider than the viewport, so let it wrap rather than scroll the page */
  .head.home .time{white-space:normal}
  .head.home{grid-template-columns:auto minmax(0,1fr) auto}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="wrap">
  <div class="stack" id="stack"></div>
</div>

<div class="wrap" style="padding-top:0">
<p class="foot">Poetry in the public domain; music repertoire selected to avoid performance licensing.</p>
</div>

<script>
(function(){
"use strict";

var ITEMS=[
 {home:true,time:"Tuesday 22 September 2026 · 12:00–1:00 PM",name:"Rooted in Gratitude",
  desc:"Patient Appreciation Month · The Ambassadors' Garden",
  lede:'An hour at the front entrance, ending with every guest planting a winter pansy for one of '+
       'our patient ambassadors. The flower is named for the French <em>pensée</em> — a thought. It '+
       'blooms through January, when almost nothing else here does. We plant on the equinox, the day '+
       'the year tips toward its dark half.'},

 {time:"11:45",name:"Gathering",desc:"Guests arrive, light nosh served.",who:"Marshals",dur:"15 min",
  dir:'No announcements and no receiving line. The cellist is already playing as people come out. '+
      'Nosh stays light and one-handed — nobody should be holding a plate when the welcome starts.',
  script:{lbl:"What the crew is doing",ps:[
   "Tools, gloves and watering cans are already staged at all three zones, out of the walking line.",
   "All two hundred and ninety pots are set out in their final positions and have been since half past ten. Spares stay out of sight.",
   "One marshal holds the door, one works the nosh table, one counts heads so the facilitator knows what she's opening to."]}},

 {time:"12:00",name:"Welcome",desc:"Who we're here for, the pansy as pensée, the equinox.",
  who:"Executive sponsor",dur:"10 min",
  dir:'Delivered standing at the top of the steps, not behind a lectern. No slides, no product '+
      'mention. The job of this piece is to explain the flower, because the flower explains the day.',
  script:{lbl:"Draft — approx. 100 seconds",ps:[
   "Thank you for being here.",
   "Every year we set aside time for the people our work is meant to serve. Today we're thinking about our patient ambassadors — the ones who told their stories so that someone they would never meet would have an easier time of it.",
   "We're going to put that thought into the ground.",
   "The flower we're planting is the pansy. Its name comes from the French <em>pensée</em> — a thought. Four hundred years ago Shakespeare had Ophelia hand them out saying \u201Cthere's pansies, that's for thoughts,\u201D and the flower has carried that meaning ever since. It isn't an accident that we chose it.",
   "It also blooms in the cold. These will be out through January, when nothing else on this campus is. Tonight is the equinox — from this evening the year tips toward the dark half. That felt like the right day to plant something that doesn't mind.",
   "In a few minutes each of you will plant one. Before that, here's how it works."]}},

 {time:"12:10",name:"Planting",
  desc:"Guests plant a pansy for ambassadors. Ends with watering in and hands washed.",
  who:"Facilitator + 3 marshals",dur:"20 min",
  dir:'Two minutes of instruction, sixteen of planting, two of watering in. Pots are already set out '+
      'in position, so nobody makes a layout decision — lift a pot, plant where it stood, firm it in. '+
      'Cello continues throughout. Marshals hand out tools and quietly fix anything planted proud.',
  script:{lbl:"Facilitator — before they start",ps:[
   "There are about two hundred and ninety plants and roughly sixty of us, so take five each. They're already sitting where they need to go — lift the pot, dig where it was standing, put it back in.",
   "Deep enough that the top of the root ball is level with the soil. Firm it down with your thumbs — pansies like to be tucked in tight. Then water it, which is the last thing we'll do together.",
   "The planters are waist height, so there's no kneeling unless you want to. Take your time. We're not in a hurry."]}},

 {time:"12:30",name:"Elegy",desc:"Poem reading.",who:"Employee volunteer",dur:"5 min",
  dir:'Read slowly, once, without introduction — the welcome has already set it up. A colleague '+
      'reading beats a leader reading; it keeps the day from feeling staged.',
  poem:{t:"Remember",by:"Christina Rossetti, 1862 · public domain",
   verse:"Remember me when I am gone away,\n    Gone far away into the silent land;\n    When you can no more hold me by the hand,\nNor I half turn to go yet turning stay.\nRemember me when no more day by day\n    You tell me of our future that you plann'd:\n    Only remember me; you understand\nIt will be late to counsel then or pray.\nYet if you should forget me for a while\n    And afterwards remember, do not grieve:\n    For if the darkness and corruption leave\n    A vestige of the thoughts that once I had,\nBetter by far you should forget and smile\n    Than that you should remember and be sad.",
   note:'Line twelve is why this is the pick: <em>a vestige of the thoughts that once I had.</em> '+
        'The poem lands on the same word the flower is named for, and it ends by releasing the room '+
        'rather than holding it in grief.'},
  opts:[
   {n:"Whitman — <em>Song of Myself</em>, §6",s:"Warmer, less elegiac",tag:"Public domain",cls:"ok",
    d:"Choose this if the tone should lift rather than settle — a better fit for a gratitude framing. Trim to twelve lines."},
   {n:"Mary Oliver or Wendell Berry",s:"Frequently requested",tag:"Permission needed",cls:"warn",
    d:"Both still in copyright. Reading aloud at a company event needs written publisher permission — allow four to six weeks and approve a public-domain backup."}]},

 {time:"12:35",name:"Requiem",
  desc:"Music performance, a single piece played in stillness, facing the bed.",
  who:"Solo cellist",dur:"5 min",
  dir:'One formal piece, seated and still, facing the planted bed rather than the crowd. Then — and '+
      'this is worth insisting on — <strong>the same musician keeps playing quietly underneath the '+
      'planting and again under the silence.</strong> Book the player for the full hour, not just '+
      'this slot.',
  opts:[
   {n:"Bach — Cello Suite No. 1 in G, Prélude",s:"Solo cello · 2:30",tag:"Recommended",cls:"pick",
    d:"Universally recognised without being sentimental, and it carries outdoors better than almost anything else. Also gives you the single note that ends the moment of silence."},
   {n:"Shenandoah",s:"Voice or solo instrument · 3:00",tag:"Traditional",cls:"ok",
    d:"The local choice — an American river song for a Virginia campus. Sung unaccompanied it will stop the room."},
   {n:"Contemporary song",s:"Anything under copyright",tag:"Licensing needed",cls:"warn",
    d:"Live performance at a company event needs a performance licence unless the property carries a blanket one. Public-domain repertoire sidesteps it entirely."}]},

 {time:"12:40",name:"Tribute",
  desc:"Ambassador names read aloud. Plaque staked, followed by a moment of silence.",
  who:"Patient advocacy lead",dur:"10 min",
  dir:'Three beats. Ambassador names read aloud, slowly. The plaque staked at the front edge of the '+
      'bed. Then one minute of silence, <strong>ended by a single note from the cello</strong> rather '+
      'than by someone speaking — so nobody has to judge when a minute is up.',
  script:{lbl:"Sequence — 10 minutes",ps:[
   "<em>Names</em> — read aloud with a pause between each. Pronunciations practised with families beforehand. Spoken names land differently than names revealed on metal.",
   "<em>Staking</em> — the plaque goes in at the front edge, into a pre-set anchor sleeve so it stands plumb. The act stays real; the result stays straight.",
   "<em>Silence</em> — sixty seconds. Outdoors with sixty people this feels much longer than anyone expects, which is the point. The cellist ends it."]}},

 {time:"12:50",name:"Gratitude",desc:"Closing remarks.",who:"Patient services lead",dur:"10 min",
  dir:'Given standing beside the plaque, not back at the steps. Ideally somebody closer to patients '+
      'than to the org chart. Then no dismissal — people should be allowed to drift back inside.',
  script:{lbl:"Draft — approx. 90 seconds",ps:[
   "That's the last of them in.",
   "What you've just done took twenty minutes and will last about six months. They look small today. They always do. Give them until March.",
   "I want to say one thing about why we do this outside, with our hands, instead of in a conference room with a slide.",
   "It's easy to be grateful in the abstract. It's harder to do something slow and physical and slightly inconvenient in someone's name — and that difficulty is the point. We wanted the hour to cost us something small.",
   "Their names are on the plaque now. The garden will be here. It doesn't need anything from you except that you notice it on your way in.",
   "If you'd like to stay a few minutes, please do. And if you'd like to plant again next year, we'll be right here. Same beds, same flower.",
   "Thank you for your time, and thank you for your care."]}}
];

/* Bands alternate green and cream so the overlap between them is visible. */
/* Five bands cycled in the order that keeps every overlap seam readable.
   Ordering was chosen by maximising the minimum RGB distance between
   neighbours: yellow>taupe>olive>pink>peri scores 97.7 at its worst seam,
   where the palette's default order bottoms out at 53.9 (taupe beside pink).
   Only olive is a dark ground, so only olive flips to light type. */
var CYCLE=['yellow','taupe','olive','pink','peri'];
function skin(el,i){
  var c=CYCLE[i%CYCLE.length], dark=(c==='olive');
  el.style.setProperty('--bg',      'var(--'+c+')');
  el.style.setProperty('--fg',      dark?'var(--paper)':'var(--ink)');
  el.style.setProperty('--accentc', dark?'var(--yellow)':'var(--ink)');
  el.style.setProperty('--focus',   dark?'var(--yellow)':'var(--ink)');
  el.style.setProperty('--bodybg',  'var(--'+c+')');
  el.style.setProperty('--bodyfg',  dark?'var(--paper)':'var(--ink)');
  el.style.setProperty('--bodyrule',dark?'var(--on-dark)':'var(--on-light)');
}


var stack=document.getElementById('stack'), open=0;

function bodyHTML(m){
  if(m.home){
    return '<div class="homegrid"><p>'+m.lede+'</p>'+
      '<div class="epi"><q>There\u2019s rosemary, that\u2019s for remembrance … and there is pansies, '+
      'that\u2019s for thoughts.</q><cite>Ophelia — Hamlet, Act IV Scene v</cite></div></div>';
  }
  var right='';
  if(m.script)right+='<div class="card"><div class="lbl">'+m.script.lbl+'</div>'+
    m.script.ps.map(function(p){return '<p>'+p+'</p>';}).join('')+'</div>';
  if(m.poem)right+='<div class="card"><div class="pt">'+m.poem.t+'</div>'+
    '<div class="pby">'+m.poem.by+'</div><div class="verse">'+m.poem.verse+'</div>'+
    '<p class="pn">'+m.poem.note+'</p></div>';
  if(m.opts)right+='<ul class="opts">'+m.opts.map(function(o){
    return '<li><span class="on">'+o.n+'<span class="os">'+o.s+'</span></span>'+
      '<span class="tag '+o.cls+'">'+o.tag+'</span><span class="od">'+o.d+'</span></li>';
  }).join('')+'</ul>';
  return '<div class="two"><p class="dir">'+m.dir+'</p>'+right+'</div>';
}

ITEMS.forEach(function(m,i){
  var item=document.createElement('div');
  item.className='item'; skin(item,i);
  var head=document.createElement('button');
  head.type='button'; head.className='head'+(m.home?' home':''); head.id='h-'+i;
  head.setAttribute('aria-expanded','false');
  head.setAttribute('aria-controls','b-'+i);
  head.innerHTML=
    '<span class="num">'+(m.home?'—':i)+'</span>'+
    '<span class="tn"><span class="time">'+m.time+'</span>'+
      '<span class="name">'+m.name+'</span></span>'+
    '<span class="desc">'+m.desc+'</span>'+
    '<span class="mark" aria-hidden="true">&#8250;</span>';
  var body=document.createElement('div');
  body.className='body'; body.id='b-'+i;
  body.setAttribute('role','region');
  body.setAttribute('aria-labelledby','h-'+i);
  body.innerHTML='<div class="bodyin">'+bodyHTML(m)+'</div>';
  head.addEventListener('click',function(){ setOpen(i); });
  head.addEventListener('keydown',function(e){
    var d=e.key==='ArrowDown'?1:e.key==='ArrowUp'?-1:0;
    if(!d)return; e.preventDefault();
    var n=(i+d+ITEMS.length)%ITEMS.length;
    setOpen(n); stack.children[n].querySelector('.head').focus();
  });
  item.appendChild(head); item.appendChild(body);
  stack.appendChild(item);
});

function setOpen(i){
  open=i;
  [].forEach.call(stack.children,function(el,j){
    var on=j===i;
    el.classList.toggle('open',on);
    el.querySelector('.head').setAttribute('aria-expanded',on?'true':'false');
  });
}
setOpen(0);   /* home band open at full height by default */
})();
</script>
